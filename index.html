<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link href="node_modules/normalize-css/normalize.css" rel="stylesheet" />
    <link href="./styles.css" rel="stylesheet" />
    <title>EXIF on your photo 📸</title>
  </head>
  <body>
    <header>
      <div id="tools">
        <button id="reset-button" class="tool">🔄 Reset</button> |
        <button id="save-button" class="tool">💾 Save</button>
        <label class="tool">
          <abbr title="Max=1 Min=0">Quality</abbr>:
          <input
            id="quality-input"
            type="number"
            value=""
            min="0"
            max="1"
            step="0.1"
          />
        </label>
        <label class="tool">
          Font:
          <select id="font-family-select"></select>
        </label>
        <label class="tool">
          <abbr title="Scaled to 1920x1280">Size</abbr>:
          <input id="font-size-input" type="number" min="1" max="9999" value="" />
        </label>
        <label>
          Format
          <select id="dimensions-select"></select>
        </label>
      </div>
    </header>
    <main>
      <div id="drop-container">Click here to add photos</div>
      <div id="canvas-farm"></div>
      <input
        id="input-label"
        class="hide"
        type="file"
        accept=".png,.jpg,.jpeg"
        multiple
      />
    </main>

    <!-- <footer>
      <ul>
        <li>Node.js <span id="node-version"></span></li>
        <li>Chromium <span id="chrome-version"></span></li>
        <li>Electron <span id="electron-version"></span></li>
      </ul>
    </footer> -->

    <!-- You can also require other files to run in this process -->
    <script src="node_modules/exifr/dist/full.umd.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
